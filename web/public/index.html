<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Westeros Admin - 356 AC</title>
    <!-- Chargement de Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white flex h-screen font-sans">

    <!-- Barre latérale -->
    <aside class="w-64 bg-gray-800 p-5 flex flex-col gap-4 shadow-xl z-10">
        <h1 class="text-2xl font-bold text-red-600 mb-5 border-b border-gray-600 pb-2">Westeros Admin</h1>
        <button onclick="chargerDonnees('profils')" class="text-left p-3 bg-gray-700 hover:bg-gray-600 rounded transition font-semibold">👤 Profils RP</button>
        <button onclick="chargerDonnees('maisons')" class="text-left p-3 bg-gray-700 hover:bg-gray-600 rounded transition font-semibold">🏰 Maisons</button>
        <button onclick="chargerDonnees('regions')" class="text-left p-3 bg-gray-700 hover:bg-gray-600 rounded transition font-semibold">🗺️ Régions</button>
    </aside>

    <!-- Zone principale -->
    <main class="flex-1 p-10 overflow-y-auto bg-gray-900">
        <h2 id="titre-section" class="text-3xl font-bold mb-8 capitalize text-gray-200">Sélectionnez une catégorie</h2>
        
        <!-- Les formulaires d'édition s'afficheront ici -->
        <div id="contenu" class="grid grid-cols-1 xl:grid-cols-2 gap-6">
            <p class="text-gray-500 italic">En attente de sélection...</p>
        </div>
    </main>

    <!-- Chargement de la logique -->
    <script src="app.js"></script>
</body>
</html>
